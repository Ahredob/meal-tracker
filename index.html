<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes repas</title>
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mes repas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#F3F6F4;--card:#fff;--ink:#16211D;--mute:#5E6D67;--line:#DCE4E0;--soft:#E8EEEB;--accent:#1F6F5B;--accent-soft:#D9ECE5;--on:#fff;--warn:#B8432C;
--p:#3F63E6;--c:#D98A1C;--l:#D4506B;--f:#2E9E6B;--b:env(safe-area-inset-bottom,0px);--t:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0F1613;--card:#17211D;--ink:#E9F0EC;--mute:#9DAEA6;--line:#26342F;--soft:#1F2C27;--accent:#5CC3A3;--accent-soft:#1D3A31;--on:#0B1F18;--warn:#F28B72;--p:#8CA3FF;--c:#F2B04C;--l:#F2849C;--f:#5CC99A}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;padding-top:var(--t)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:inherit;cursor:pointer}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%}
#app{max-width:560px;margin:0 auto;padding:0 14px calc(84px + var(--b))}
.top{display:flex;align-items:center;gap:6px;padding:12px 0 8px}.top .t{flex:1;text-align:center;min-width:0}.top h1{margin:0;font-size:19px}
.ib{width:46px;height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:22px;flex:none}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.sum{padding:14px 16px}.sum .k{display:flex;align-items:baseline;gap:6px}.sum .k b{font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}.sum .k span{color:var(--mute);font-size:14px}.sum .k .r{margin-left:auto;font-weight:650;font-size:14px}
.gs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.g .gt{font-size:12px;color:var(--mute);display:flex;justify-content:space-between}.g .gt b{color:var(--ink)}
.tr{height:7px;border-radius:9px;background:var(--soft);margin-top:4px;overflow:hidden}.tr i{display:block;height:100%;border-radius:9px;background:var(--m)}
.c-p{--m:var(--p)}.c-c{--m:var(--c)}.c-l{--m:var(--l)}.c-f{--m:var(--f)}
.mh{display:flex;justify-content:space-between;padding:12px 16px 4px}.mh h2{margin:0;font-size:16px}.mh span{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.it{display:grid;grid-template-columns:76px 1fr auto;gap:2px 10px;align-items:center;width:100%;padding:11px 16px;border-top:1px solid var(--line);min-height:52px}
.it:active{background:var(--soft)}.it .q{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;grid-row:span 2}.it .n{line-height:1.25}.it .kk{font-weight:600;font-variant-numeric:tabular-nums}.it .mm{grid-column:2/4;font-size:12px;color:var(--mute)}
.it.mod .q::after{content:" ●";font-size:9px;color:var(--warn)}
.ttl{font-size:17px;font-weight:650;margin:2px 2px 10px}
.empty{color:var(--mute);text-align:center;padding:40px 10px}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:2px 10px;align-items:center;width:100%;padding:12px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}.row b{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.row .bar{grid-column:2/4;height:6px;border-radius:6px;background:var(--soft);overflow:hidden}.row .bar i{display:block;height:100%;background:var(--accent)}.row .bar.o i{background:var(--warn)}
.gh{font-size:12.5px;font-weight:650;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;padding:12px 4px 6px}
.chk{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border-top:1px solid var(--line)}.chk:first-child{border-top:0}
.bx{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none}.chk.on .bx{background:var(--accent);border-color:var(--accent)}.chk.on .tx{text-decoration:line-through;color:var(--mute)}.chk .qt{margin-left:auto;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:var(--b);z-index:5}
nav div{display:flex;max-width:560px;margin:0 auto}nav button{flex:1;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--mute)}nav button.on{color:var(--accent)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ov{position:fixed;inset:0;background:rgba(8,16,12,.5);z-index:20;display:flex;align-items:flex-end}
.sh{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + var(--b));max-height:90dvh;overflow-y:auto}
.sh h2{margin:0 0 2px;font-size:19px}.mini{font-size:13px;color:var(--mute)}
.qr{display:flex;gap:10px;align-items:center;margin:14px 0}.qr input{text-align:center;font-size:28px;font-weight:700;padding:10px}.qr button{width:56px;height:56px;border-radius:14px;background:var(--soft);font-size:28px;text-align:center;flex:none}
.u{color:var(--mute);min-width:36px}
.mg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.mg div{background:var(--card);border:1px solid var(--line);border-radius:12px;text-align:center;padding:9px 2px}.mg b{display:block;font-size:18px;font-variant-numeric:tabular-nums}.mg span{font-size:11px;color:var(--mute)}
.mg .c-p b{color:var(--p)}.mg .c-c b{color:var(--c)}.mg .c-l b{color:var(--l)}.mg .c-f b{color:var(--f)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:13px;background:var(--soft);font-weight:650;min-height:46px}.btn.pri{background:var(--accent);color:var(--on)}
.acts{display:flex;gap:8px;margin-top:14px}.acts .btn{flex:1}
.ai{display:block;width:100%;padding:11px 16px;border-top:1px solid var(--line)}.ai:first-child{border-top:0}.ai small{display:block;color:var(--mute)}
.foot{color:var(--mute);font-size:12.5px;text-align:center;margin:16px 0}
.delta{font-size:14px;margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--accent-soft)}
</style>
</head>
<body>
<div id="app"></div>
<nav><div id="nav"></div></nav>
<div id="sheet"></div>
<script>
"use strict";
var D = null;
var mtId = '', mtBusy = false, mtLast = 0;
function mtGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function mtSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
function mtParseId(s) { var m = String(s || '').match(/[0-9a-f]{20,40}/i); return m ? m[0].toLowerCase() : ''; }
function mtFetch() {
  return fetch('https://api.github.com/gists/' + mtId, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' }).then(function (r) {
    if (r.status === 404) throw new Error('Lien introuvable : le lien est peut-être incomplet ou la synchronisation a été arrêtée.');
    if (r.status === 403 || r.status === 429) throw new Error('GitHub limite les requêtes pour le moment. Réessaie dans quelques minutes.');
    if (!r.ok) throw new Error('Erreur GitHub (' + r.status + ').');
    return r.json();
  }).then(function (j) {
    var f = j.files && (j.files['meal-tracker-data.json'] || j.files[Object.keys(j.files)[0]]);
    if (!f) throw new Error('Fichier de données absent.');
    if (f.truncated && f.raw_url) return fetch(f.raw_url).then(function (r) { return r.text(); });
    return f.content;
  }).then(function (txt) { var d = JSON.parse(txt); mtSet('mt-data', txt); mtSet('mt-ok', String(Date.now())); return d; });
}
function mtScreen(msg, withInput) {
  document.getElementById('nav').innerHTML = '';
  document.getElementById('app').innerHTML = '<div class="top"><div class="t"><h1>Mes repas</h1></div></div><div class="card" style="padding:16px"><p>' + msg + '</p>' + (withInput ? '<input id="mtcode" type="text" placeholder="Colle ici le lien ou le code" autocapitalize="off" autocorrect="off" spellcheck="false"><div class="acts"><button class="btn pri" data-a="mtcode">Valider</button></div>' : '<div class="acts"><button class="btn pri" data-a="refresh">Réessayer</button></div>') + '</div>';
}
function mtRefresh(manual) {
  if (!mtId || mtBusy) return; mtBusy = true;
  return mtFetch().then(function (d) {
    window.mtNote = '';
    if (!D) { D = d; window.mtStart(); } else if (!window.mtApply(d)) { /* fenêtre ouverte : on réessaiera */ }
  }).catch(function (e) {
    if (!D) { mtScreen(e.message + (navigator.onLine === false ? ' (Pas de connexion internet.)' : ''), false); return; }
    window.mtNote = navigator.onLine === false || /Failed|Network|load/i.test(e.message) ? 'Hors ligne : ce sont les dernières données enregistrées sur ce téléphone.' : e.message;
    window.mtApply(D);
  }).then(function () { mtBusy = false; mtLast = Date.now(); });
}
function mtBoot() {
  mtId = mtParseId(location.hash) || mtParseId(mtGet('mt-id'));
  if (!mtId) { mtScreen('Pour voir tes repas, ouvre le lien que l\'application t\'a donné (dans Réglages › Téléphone), ou colle-le ici.', true); return; }
  mtSet('mt-id', mtId);
  var cached = mtGet('mt-data');
  if (cached) { try { D = JSON.parse(cached); } catch (e) { D = null; } }
  if (D) { window.mtStart(); }
  mtRefresh(false);
}
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a="refresh"],[data-a="mtcode"]'); if (!el) return;
  if (el.dataset.a === 'mtcode') { var id = mtParseId(document.getElementById('mtcode').value); if (id) { mtId = id; mtSet('mt-id', id); mtScreen('Chargement…', false); mtRefresh(false); } return; }
  window.mtNote = ''; mtRefresh(true);
});
document.addEventListener('visibilitychange', function () { if (!document.hidden && D && Date.now() - mtLast > 90000) mtRefresh(false); });

window.mtStart = function () {
var MEALS = [['matin', 'Matin'], ['midi', 'Midi'], ['snack', 'Snack'], ['soir', 'Soir']];
var WD = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
var MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
var foods = {}; D.foods.forEach(function (f) { foods[f.id] = f; });
function pad(n) { return (n < 10 ? '0' : '') + n; }
function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parse(s) { var a = s.split('-'); return new Date(+a[0], a[1] - 1, +a[2]); }
function add(s, n) { var d = parse(s); d.setDate(d.getDate() + n); return iso(d); }
function monday(s) { var d = parse(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return iso(d); }
function wdi(s) { return (parse(s).getDay() + 6) % 7; }
function long(s) { var d = parse(s); return WD[wdi(s)] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function short(s) { var d = parse(s); return d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0, 4).replace(/é/, 'é'); }
function n0(v) { return Math.round(v).toLocaleString('fr-FR'); }
function n1(v) { return (Math.round(v * 10) / 10).toLocaleString('fr-FR'); }
function qtxt(v) { return String(Math.round(v * 100) / 100).replace('.', ','); }
function num(v) { var x = parseFloat(String(v).replace(',', '.')); return isFinite(x) ? x : 0; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function ulabel(f) { return f.unit === 'portion' ? '×' : f.unit; }
function label(m) { return D.weeks[m] || autoLabel(m); }
function autoLabel(m) {
  var ks = Object.keys(D.weeks).sort(), best = null; ks.forEach(function (k) { if (k < m) best = k; });
  if (!best) return '1';
  var l = D.weeks[best], n = Math.round((parse(m) - parse(best)) / 6048e5);
  for (var i = 0; i < n; i++) l = l === 'P' ? '1' : (l === '8' || l === '9') ? 'P' : String(+l + 1);
  return l;
}
function lname(l) { return l === 'P' ? 'Pause' : 'Semaine ' + l; }
function target(date) { return D.targets[label(monday(date))] || D.targets['1']; }
var today = iso(new Date());
var st = { view: 'day', date: (today >= D.start && today <= D.end) ? today : D.start, ov: {}, calc: null, q: '', shop: {} };
try { st.shop = JSON.parse(localStorage.getItem('mt-shop') || '{}'); } catch (e) { }
function saveShop() { try { localStorage.setItem('mt-shop', JSON.stringify(st.shop)); } catch (e) { } }
function qty(date, meal, i, q0) { var k = date + '|' + meal + '|' + i; return st.ov[k] != null ? st.ov[k] : q0; }
function macros(f, q) { return { p: f.p * q, c: f.c * q, l: f.l * q, f: f.f * q, k: f.k * q }; }
function dayTot(date) {
  var t = { p: 0, c: 0, l: 0, f: 0, k: 0 }, d = D.days[date]; if (!d) return t;
  MEALS.forEach(function (m) { (d.meals[m[0]] || []).forEach(function (e, i) { var f = foods[e[0]]; if (!f) return; var x = macros(f, qty(date, m[0], i, e[1])); for (var k in t) t[k] += x[k]; }); });
  return t;
}
function dayCount(d) { return d ? MEALS.reduce(function (n, m) { return n + (d.meals[m[0]] || []).length; }, 0) : 0; }
var $ = function (s) { return document.querySelector(s); };

function viewDay() {
  var date = st.date, d = D.days[date], tg = target(date), l = label(monday(date)), soft = l === 'P', t = dayTot(date);
  var rem = tg.k - t.k;
  var head = '<div class="top"><button class="ib" data-a="d" data-n="-1" aria-label="Jour précédent">‹</button><div class="t"><h1>' + long(date) + '</h1><span class="chip">' + lname(l) + (date === today ? ' · aujourd\'hui' : '') + '</span></div><button class="ib" data-a="d" data-n="1" aria-label="Jour suivant">›</button></div>';
  if (!dayCount(d)) return head + '<div class="empty">Rien de prévu ce jour-là.' + (date < D.start || date > D.end ? '<br><span class="mini">Cette page ne couvre que du ' + short(D.start) + ' au ' + short(D.end) + '.</span>' : '') + '</div>' + foot();
  var bars = [['p', 'Prot.'], ['c', 'Gluc.'], ['l', 'Lip.'], ['f', 'Fib.']].map(function (m) { var k = m[0], pc = Math.min(100, tg[k] ? t[k] / tg[k] * 100 : 0); return '<div class="g c-' + k + '"><div class="gt"><span>' + m[1] + '</span><b>' + n0(t[k]) + '</b></div><div class="tr"><i style="width:' + pc + '%"></i></div><div class="gt"><span>/ ' + n0(tg[k]) + ' g</span></div></div>'; }).join('');
  var mod = Object.keys(st.ov).some(function (k) { return k.indexOf(date + '|') === 0; });
  var h = head + '<div class="card sum"><div class="k"><b>' + n0(t.k) + '</b><span>/ ' + n0(tg.k) + ' kcal</span><span class="r" style="color:' + (rem < 0 && !soft ? 'var(--warn)' : 'var(--accent)') + '">' + (rem >= 0 ? 'reste ' + n0(rem) : '+' + n0(-rem)) + '</span></div><div class="gs">' + bars + '</div></div>';
  if (d.title) h += '<div class="ttl">' + esc(d.title) + '</div>';
  MEALS.forEach(function (m) {
    var list = d.meals[m[0]] || []; if (!list.length) return;
    var mt = { k: 0 };
    var rows = list.map(function (e, i) {
      var f = foods[e[0]]; if (!f) return ''; var q = qty(date, m[0], i, e[1]), x = macros(f, q); mt.k += x.k;
      return '<button class="it' + (q !== e[1] ? ' mod' : '') + '" data-a="edit" data-m="' + m[0] + '" data-i="' + i + '"><span class="q">' + qtxt(q) + ' ' + ulabel(f) + '</span><span class="n">' + esc(f.name) + '</span><span class="kk">' + n0(x.k) + '</span><span class="mm">P ' + n1(x.p) + ' · G ' + n1(x.c) + ' · L ' + n1(x.l) + ' · F ' + n1(x.f) + '</span></button>';
    }).join('');
    h += '<div class="card"><div class="mh"><h2>' + m[1] + '</h2><span>' + n0(mt.k) + ' kcal</span></div>' + rows + '</div>';
  });
  if (mod) h += '<div class="acts"><button class="btn" data-a="reset">Annuler mes changements du jour</button></div><p class="foot">Les quantités modifiées ici ne sont pas enregistrées.</p>';
  return h + foot();
}
function foot() { var g = new Date(D.generated); return (window.mtNote ? '<p class="foot" style="color:var(--warn)">' + window.mtNote + '</p>' : '') + '<div class="acts"><button class="btn" data-a="refresh">Actualiser</button></div><p class="foot">Mis à jour le ' + g.getDate() + ' ' + MONTHS[g.getMonth()] + ' à ' + pad(g.getHours()) + ':' + pad(g.getMinutes()) + ' depuis l\'ordinateur.</p>'; }
function viewWeek() {
  var mon = monday(st.date), l = label(mon), tg = D.targets[l] || D.targets['1'], soft = l === 'P';
  var h = '<div class="top"><button class="ib" data-a="w" data-n="-1" aria-label="Semaine précédente">‹</button><div class="t"><h1>' + short(mon) + ' → ' + short(add(mon, 6)) + '</h1><span class="chip">' + lname(l) + ' · ' + n0(tg.k) + ' kcal</span></div><button class="ib" data-a="w" data-n="1" aria-label="Semaine suivante">›</button></div><div class="card">';
  for (var i = 0; i < 7; i++) {
    var date = add(mon, i), d = D.days[date], t = dayTot(date), n = dayCount(d), over = n && t.k > tg.k && !soft;
    h += '<button class="row" data-a="goday" data-d="' + date + '"><b>' + WD[i].slice(0, 3) + ' ' + parse(date).getDate() + '</b><span>' + (d && d.title ? esc(d.title) : n ? 'Sans nom' : '<span class="mini">Rien de prévu</span>') + '</span><span>' + (n ? n0(t.k) + ' kcal' : '') + '</span>' + (n ? '<div class="bar' + (over ? ' o' : '') + '"><i style="width:' + Math.min(100, t.k / tg.k * 100) + '%"></i></div>' : '') + '</button>';
  }
  return h + '</div>' + foot();
}
function shopList(mon) {
  var agg = {};
  for (var i = 0; i < 7; i++) { var d = D.days[add(mon, i)]; if (!d) continue; MEALS.forEach(function (m) { (d.meals[m[0]] || []).forEach(function (e) { agg[e[0]] = (agg[e[0]] || 0) + e[1]; }); }); }
  var g = {}; Object.keys(agg).forEach(function (id) { var f = foods[id]; if (f) (g[f.cat] = g[f.cat] || []).push({ f: f, q: agg[id] }); });
  return Object.keys(g).sort(function (a, b) { return a.localeCompare(b, 'fr'); }).map(function (c) { return [c, g[c].sort(function (a, b) { return a.f.name.localeCompare(b.f.name, 'fr'); })]; });
}
function viewShop() {
  var mon = monday(st.date), groups = shopList(mon), ck = st.shop[mon] || {};
  var h = '<div class="top"><button class="ib" data-a="w" data-n="-1" aria-label="Semaine précédente">‹</button><div class="t"><h1>Courses</h1><span class="chip">' + short(mon) + ' → ' + short(add(mon, 6)) + '</span></div><button class="ib" data-a="w" data-n="1" aria-label="Semaine suivante">›</button></div>';
  if (!groups.length) return h + '<div class="empty">Aucun repas prévu cette semaine-là.</div>' + foot();
  groups.forEach(function (g) {
    h += '<div class="gh">' + esc(g[0]) + '</div><div class="card">' + g[1].map(function (r) {
      return '<button class="chk' + (ck[r.f.id] ? ' on' : '') + '" data-a="chk" data-id="' + r.f.id + '"><span class="bx"></span><span class="tx">' + esc(r.f.name) + '</span><span class="qt">' + (r.f.unit === 'portion' ? n1(r.q) + ' ×' : n0(Math.ceil(r.q)) + ' ' + r.f.unit) + '</span></button>';
    }).join('') + '</div>';
  });
  return h + '<div class="acts"><button class="btn" data-a="unchk">Tout décocher</button></div>' + foot();
}
function viewCalc() {
  var h = '<div class="top"><div class="t" style="text-align:left"><h1>Calculer une quantité</h1><span class="mini">Pour n\'importe quel aliment de ta base</span></div></div><input id="cq" type="search" placeholder="Rechercher un aliment…" value="' + esc(st.q) + '" autocomplete="off"><div class="card" id="clist" style="margin-top:10px"></div>';
  return h;
}
function calcList() {
  var words = st.q.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').split(/\s+/).filter(Boolean);
  var list = D.foods.filter(function (f) { var n = f.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); return words.every(function (w) { return n.indexOf(w) >= 0; }); }).sort(function (a, b) { return a.name.localeCompare(b.name, 'fr'); }).slice(0, 40);
  var el = $('#clist'); if (!el) return;
  el.innerHTML = list.map(function (f) { var fac = f.unit === 'portion' ? 1 : 100; return '<button class="ai" data-a="calcpick" data-id="' + f.id + '">' + esc(f.name) + '<small>' + (f.unit === 'portion' ? '1 part' : '100 ' + f.unit) + ' : ' + n0(f.k * fac) + ' kcal · P ' + n1(f.p * fac) + '</small></button>'; }).join('') || '<p class="mini" style="padding:14px">Aucun résultat.</p>';
}
function sheet(f, q, key) {
  var step = f.unit === 'portion' ? 0.5 : 5, x = macros(f, q);
  var s = '<div class="ov" data-a="close"><div class="sh" role="dialog" aria-modal="true"><h2>' + esc(f.name) + '</h2><div class="mini">' + (f.unit === 'portion' ? '1 part' : '100 ' + f.unit) + ' : ' + n0(f.k * (f.unit === 'portion' ? 1 : 100)) + ' kcal · P ' + n1(f.p * (f.unit === 'portion' ? 1 : 100)) + ' · G ' + n1(f.c * (f.unit === 'portion' ? 1 : 100)) + ' · L ' + n1(f.l * (f.unit === 'portion' ? 1 : 100)) + '</div>' +
    '<div class="qr"><button data-a="step" data-d="-' + step + '" aria-label="Moins">−</button><input id="sq" type="text" inputmode="decimal" value="' + qtxt(q) + '" aria-label="Quantité"><span class="u">' + (f.unit === 'portion' ? 'part(s)' : f.unit) + '</span><button data-a="step" data-d="' + step + '" aria-label="Plus">+</button></div>' +
    '<div class="mg" id="smg"></div><div class="delta" id="sdl" hidden></div><div class="acts"><button class="btn" data-a="sreset">' + (key ? 'Quantité d\'origine' : 'Effacer') + '</button><button class="btn pri" data-a="close">OK</button></div></div></div>';
  $('#sheet').innerHTML = s; sheetUpdate();
}
var cur = null; // {f, key, q0, date}
function sheetUpdate() {
  if (!cur) return; var q = num($('#sq').value), x = macros(cur.f, q);
  $('#smg').innerHTML = [['p', 'Prot.'], ['c', 'Gluc.'], ['l', 'Lip.'], ['f', 'Fib.'], ['k', 'kcal']].map(function (m) { return '<div class="c-' + m[0] + '"><b>' + (m[0] === 'k' ? n0(x[m[0]]) : n1(x[m[0]])) + '</b><span>' + m[1] + '</span></div>'; }).join('');
  var dl = $('#sdl');
  if (cur.key) {
    st.ov[cur.key] = q; if (q === cur.q0) delete st.ov[cur.key];
    var t = dayTot(cur.date), tg = target(cur.date); dl.hidden = false;
    dl.innerHTML = 'Total du jour : <b>' + n0(t.k) + ' kcal</b> sur ' + n0(tg.k) + ' · protéines <b>' + n0(t.p) + ' g</b> sur ' + n0(tg.p);
  } else dl.hidden = true;
}
function render() {
  var v = st.view, h = v === 'day' ? viewDay() : v === 'week' ? viewWeek() : v === 'shop' ? viewShop() : viewCalc();
  $('#app').innerHTML = h;
  var I = { day: '<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/>', week: '<rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8 14h8M8 17.5h5"/>', shop: '<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/>', calc: '<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/>' };
  $('#nav').innerHTML = [['day', 'Jour'], ['week', 'Semaine'], ['shop', 'Courses'], ['calc', 'Calcul']].map(function (x) { return '<button class="' + (v === x[0] ? 'on' : '') + '" data-a="tab" data-v="' + x[0] + '"><svg viewBox="0 0 24 24">' + I[x[0]] + '</svg>' + x[1] + '</button>'; }).join('');
  if (v === 'calc') calcList();
}
function closeSheet() { $('#sheet').innerHTML = ''; cur = null; render(); }
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-a]'); if (!el) return; var a = el.dataset.a;
  if (a === 'close') { if (e.target === el || el.tagName === 'BUTTON') closeSheet(); return; }
  if (a === 'tab') { st.view = el.dataset.v; window.scrollTo(0, 0); render(); }
  else if (a === 'd') { st.date = add(st.date, +el.dataset.n); render(); }
  else if (a === 'w') { st.date = add(st.date, 7 * +el.dataset.n); render(); }
  else if (a === 'goday') { st.date = el.dataset.d; st.view = 'day'; render(); window.scrollTo(0, 0); }
  else if (a === 'edit') { var d = D.days[st.date], m = el.dataset.m, i = +el.dataset.i, e0 = d.meals[m][i], f = foods[e0[0]]; cur = { f: f, key: st.date + '|' + m + '|' + i, q0: e0[1], date: st.date }; sheet(f, qty(st.date, m, i, e0[1]), cur.key); }
  else if (a === 'reset') { Object.keys(st.ov).forEach(function (k) { if (k.indexOf(st.date + '|') === 0) delete st.ov[k]; }); render(); }
  else if (a === 'step') { var inp = $('#sq'); inp.value = qtxt(Math.max(0, num(inp.value) + +el.dataset.d)); sheetUpdate(); }
  else if (a === 'sreset') { $('#sq').value = qtxt(cur.key ? cur.q0 : 0); sheetUpdate(); }
  else if (a === 'calcpick') { var f2 = foods[el.dataset.id]; cur = { f: f2, key: null }; sheet(f2, f2.unit === 'portion' ? 1 : 100, null); }
  else if (a === 'chk') { var mon = monday(st.date); (st.shop[mon] = st.shop[mon] || {}); st.shop[mon][el.dataset.id] = !st.shop[mon][el.dataset.id]; saveShop(); render(); }
  else if (a === 'unchk') { st.shop[monday(st.date)] = {}; saveShop(); render(); }
});
document.addEventListener('input', function (e) {
  if (e.target.id === 'sq') sheetUpdate();
  else if (e.target.id === 'cq') { st.q = e.target.value; calcList(); }
});
render();
window.mtApply = function (nd) { if (cur) return false; D = nd; foods = {}; D.foods.forEach(function (f) { foods[f.id] = f; }); render(); return true; };
};
mtBoot();
</script>
</body>
