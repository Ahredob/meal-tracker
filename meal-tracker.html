<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meal Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icone.png">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="icone.png">
<style>
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --ink:#16211D; --mute:#5E6D67; --line:#DCE4E0; --soft:#E8EEEB;
  --accent:#1F6F5B; --accent-soft:#D9ECE5; --on-accent:#fff; --warn:#B8432C; --warn-soft:#F7E1DB;
  --p:#3F63E6; --c:#D98A1C; --l:#D4506B; --f:#2E9E6B; --k:#16211D;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-mode=light]){
  --bg:#0F1613; --surface:#17211D; --ink:#E9F0EC; --mute:#9DAEA6; --line:#26342F; --soft:#1F2C27;
  --accent:#5CC3A3; --accent-soft:#1D3A31; --on-accent:#0B1F18; --warn:#F28B72; --warn-soft:#3A211B;
  --p:#8CA3FF; --c:#F2B04C; --l:#F2849C; --f:#5CC99A; --k:#E9F0EC; color-scheme:dark}}
:root[data-mode=dark]{
  --bg:#0F1613; --surface:#17211D; --ink:#E9F0EC; --mute:#9DAEA6; --line:#26342F; --soft:#1F2C27;
  --accent:#5CC3A3; --accent-soft:#1D3A31; --on-accent:#0B1F18; --warn:#F28B72; --warn-soft:#3A211B;
  --p:#8CA3FF; --c:#F2B04C; --l:#F2849C; --f:#5CC99A; --k:#E9F0EC; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,[data-a]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);padding:0}
h1,h2,h3,h5{margin:0}
h1{font-size:23px;letter-spacing:-.01em}
a{color:var(--accent)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mini{font-size:13px;color:var(--mute)} .mu{color:var(--mute)} .warn{color:var(--warn)}
#app{display:grid;grid-template-columns:190px minmax(0,1fr) 300px;min-height:100vh;max-width:1500px;margin:0 auto}
.side{position:sticky;top:0;align-self:start;height:100vh;padding:20px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.side .brand{font-weight:750;font-size:17px;color:var(--accent);padding:2px 10px 16px}
.side button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--mute);font-weight:550}
.side button:hover{background:var(--soft)} .side button.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.main{padding:20px 26px 60px;min-width:0;grid-column:2}
.main.wide{grid-column:2}
.right{grid-column:3;position:sticky;top:0;align-self:start;max-height:100vh;overflow-y:auto;border-left:1px solid var(--line);padding:22px 18px;background:var(--bg)}
.right h5,.card h2{font-size:11.5px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
.card h2{font-size:17px;letter-spacing:0;text-transform:none;color:var(--ink);margin-bottom:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px}
.card p{max-width:70ch;margin:6px 0}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.dt{min-width:0;flex:1 1 280px}
.dt .chips{margin-top:5px}
.sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none;color:var(--ink);background:var(--surface);border:1px solid var(--line)}
.ib:hover{background:var(--soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;padding:4px 11px;border-radius:99px;background:var(--soft);color:var(--ink);white-space:nowrap}
button.chip:hover{filter:brightness(.96)}
.chip.acc{background:var(--accent-soft);color:var(--accent)} .chip.on{background:var(--accent);color:var(--on-accent)}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;min-height:38px}
.btn:hover{background:var(--soft)} .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)} .btn.pri:hover{filter:brightness(1.08)}
.btn.dng{color:var(--warn)}
.btn input[type=date]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.titlein{margin-bottom:14px;font-weight:600;font-size:16px}
/* repas */
.meal{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.meal .mh{display:flex;justify-content:space-between;align-items:center;background:var(--soft);padding:9px 14px}
.meal .mh h3{font-size:15px} .meal .mh span{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13.5px}
.ln{display:grid;grid-template-columns:104px minmax(0,1fr) repeat(4,50px) 56px 34px;gap:6px;align-items:center;padding:5px 14px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.ln>span{text-align:right}
.ln.h{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;border-top:0;padding-block:5px}
.ln.h>span:nth-child(-n+2),.ln .lb{text-align:left}
.ln .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .ln .k{font-weight:600}
.ln.gone .n{color:var(--warn)}
.ln.mu{color:var(--mute)} .ln .lb{font-weight:650;color:var(--accent)} .ln.mu .lb{color:var(--mute)}
.qc{display:flex;align-items:center;gap:6px}
.qin{width:68px;text-align:right;font-weight:650;color:var(--accent);padding:5px 7px;border-color:transparent;background:transparent}
.qin:hover{border-color:var(--line)} .qin:focus{background:var(--surface);border-color:var(--accent)}
.qc .u{font-size:12.5px;color:var(--mute)}
.x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--mute);opacity:.5}
.ln:hover .x,.x:focus-visible{opacity:1} .x:hover{background:var(--warn-soft);color:var(--warn)}
.x svg{width:16px;height:16px}
.add{display:flex;align-items:center;gap:8px;width:100%;padding:11px 14px;border-top:1px solid var(--line);color:var(--accent);font-weight:650}
.add:hover{background:var(--accent-soft)}
.meal.total{border-color:var(--accent)} .meal.total .mh{background:var(--accent-soft);color:var(--accent)} .meal.total .mh span{color:var(--accent);font-weight:650}
/* jauges */
.kbig{display:flex;align-items:baseline;gap:7px}
.kbig b{font-size:34px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums} .kbig b.neg{color:var(--warn)} .kbig span{color:var(--mute);font-size:13.5px}
.right .mini{margin:2px 0 16px}
.g{margin-bottom:14px}.g .gt{display:flex;justify-content:space-between;font-size:13px}.g .gt b{font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:9px;background:var(--soft);margin:5px 0 3px;overflow:hidden}.track i{display:block;height:100%;border-radius:9px;background:var(--m);transition:width .2s}
.g .gr{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}.g .gr.o{color:var(--warn);font-weight:600}
.c-p{--m:var(--p)}.c-c{--m:var(--c)}.c-l{--m:var(--l)}.c-f{--m:var(--f)}.c-k{--m:var(--k)}
.sugg{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:6px}
.sugg b{display:block;margin-bottom:3px}
/* tableaux */
.tw{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:calc(100vh - 250px)}
table{border-collapse:collapse;width:100%}
.ft{font-size:13.5px;font-variant-numeric:tabular-nums}
.ft th{position:sticky;top:0;background:var(--soft);text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:8px 10px}
.ft td{padding:7px 10px;border-top:1px solid var(--line)}
.ft tbody tr[data-a]{cursor:pointer}.ft tbody tr[data-a]:hover td{background:var(--soft)}.ft tr.sel td{background:var(--accent-soft)}.ft tr.hid{opacity:.55}
.ft td:nth-child(n+4),.ft th:nth-child(n+4){text-align:right}
.tg td:nth-child(n+2),.tg th:nth-child(n+2){text-align:center}.tg td input{max-width:90px;text-align:center}
.tag{font-size:11px;font-weight:650;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}.tag.g{background:var(--soft);color:var(--mute)}
.search{position:relative;margin:2px 0 10px}.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--mute)}.search input{padding-left:36px}
.sw{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:14px}
/* formulaire */
.right label{display:block;font-size:12px;font-weight:650;color:var(--mute);margin:12px 0 4px}
.right .sw{display:flex;font-size:14px;color:var(--ink);font-weight:500}.right .lbl{font-size:12px;font-weight:650;color:var(--mute);margin-top:14px;text-transform:uppercase;letter-spacing:.05em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{background:var(--accent-soft);border-radius:9px;padding:9px 12px;font-size:13px;margin:12px 0}.note.w{background:var(--warn-soft)}
/* fenêtres */
.ov{position:fixed;inset:0;background:rgba(8,16,12,.5);z-index:50;display:grid;place-items:start center;padding:6vh 14px 14px;overflow-y:auto}
.dlg{background:var(--bg);border-radius:14px;width:min(640px,100%);box-shadow:0 24px 60px -12px rgba(0,0,0,.5);display:flex;flex-direction:column;max-height:88vh}
.dh2{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 4px 18px}.dh2 h2{font-size:18px}
.dlg .bd{padding:8px 18px 16px;overflow-y:auto}.dlg .bd .col{display:flex;flex-direction:column;gap:8px}
.ft2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--line)}
.alist{border:1px solid var(--line);border-radius:10px;background:var(--surface);max-height:46vh;overflow-y:auto;margin-top:6px}
.ai{display:flex;justify-content:space-between;gap:12px;align-items:baseline;width:100%;padding:8px 12px;border-top:1px solid var(--line)}
.ai:first-child{border-top:0}.ai:hover,.ai.sel{background:var(--accent-soft)}
.ai .an{font-weight:600}.ai .am{font-size:12px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.qh{margin-bottom:14px}
.qrow{display:flex;align-items:center;gap:10px}.qrow input{font-size:26px;font-weight:700;text-align:center;padding:8px;font-variant-numeric:tabular-nums}
.sq{width:48px;height:48px;font-size:24px}.qu{color:var(--mute);min-width:44px}
.mg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 8px}
.mg>div{background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:center;padding:8px 2px}.mg b{display:block;font-size:18px;color:var(--m)}.mg span{font-size:11.5px;color:var(--mute)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:90}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* écrans étroits */
@media (max-width:1060px){
  #app{grid-template-columns:minmax(0,1fr);}
  .side{position:static;height:auto;flex-direction:row;padding:8px 10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;grid-column:1}
  .side .brand{padding:8px 12px 8px 4px}
  .main,.main.wide{grid-column:1;padding:14px 14px 40px}
  .right{grid-column:1;position:static;max-height:none;border-left:0;border-top:1px solid var(--line);padding:18px 14px 40px;order:3}
  .ln{grid-template-columns:96px minmax(110px,1fr) repeat(4,44px) 50px 30px;overflow-x:auto}
}
@media (max-width:640px){.main{padding-inline:10px}.meal{overflow-x:auto}.ln{min-width:520px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* étape 2 */
.tools{margin:0 0 12px}
.lnk{margin-left:auto;margin-right:12px;font-size:12.5px;font-weight:600;color:var(--accent);padding:3px 8px;border-radius:7px}.lnk:hover{background:var(--surface)}
.acts{display:flex;gap:2px;justify-content:flex-end}
.ln{grid-template-columns:104px minmax(0,1fr) repeat(4,50px) 56px 66px}
.main.wide2{grid-column:2}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:14px}
.dc{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px;min-height:170px;display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left;font:inherit}
.dc:hover{border-color:var(--accent)}.dc.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dc b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.dc .ti{font-weight:600;line-height:1.25;font-size:13.5px}.dc .mm{font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.dc .tr{height:6px;border-radius:6px;background:var(--soft);overflow:hidden}.dc .tr i{display:block;height:100%;background:var(--accent)}.dc .tr.o i{background:var(--warn)}
.dc .kc{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:auto}.dc .kc small{font-size:11px;font-weight:500;color:var(--mute)}
.dc.empty{border-style:dashed;color:var(--mute)}
.avg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}.avg h5{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.avgg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.avgg>div span{font-size:12px;color:var(--mute);display:block}.avgg b{font-size:21px;font-variant-numeric:tabular-nums}.avgg small{display:block;font-size:11.5px;color:var(--mute)}
.hw{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.hwh{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);padding:8px 12px}.hwh span{color:var(--mute);font-size:12.5px;margin-left:auto}
.hd{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.1fr) 52px auto;gap:10px;align-items:center;padding:7px 12px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.hd .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hd .m{color:var(--mute);font-size:12px}.hd .k{text-align:right;font-weight:650}.hd .b{display:flex;gap:6px}.btn.sm{padding:4px 10px;min-height:30px;font-size:12.5px}.hd.mu .t{font-weight:500}
.dnav{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:8px}.dnav>div{text-align:center}
.dest{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:10px}.dest button{border:1px solid var(--line);border-radius:8px;text-align:center;padding:6px 0;font-size:12.5px;background:var(--surface)}.dest button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.right .seg{margin-top:10px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px}.seg button{flex:1;text-align:center;padding:7px 8px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--mute)}.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.src{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:11px;margin-top:8px;text-align:left}
button.src:hover{border-color:var(--accent);background:var(--accent-soft)}.src[disabled]{opacity:.45;pointer-events:none}
.src .b{flex:1;min-width:0}.src .b b{display:block}.src .b span{font-size:12.5px;color:var(--mute);display:block}.src>.mini{text-align:right;max-width:46%}.src input[type=date]{width:auto}
.pv{background:var(--surface);border:1px solid var(--line);border-radius:11px;margin:8px 0;overflow:hidden}
.chk{display:flex;gap:12px;align-items:flex-start;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer}.chk:first-child{border-top:0}.chk input{margin-top:3px;flex:none}
.wrow2{display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:7px 12px;border-top:1px solid var(--line);font-size:14px}.wrow2:first-child{border-top:0}
.gh{font-size:12px;font-weight:650;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;padding:14px 4px 6px}
.card.list{padding:0;overflow:hidden}.li{display:flex;align-items:center;gap:12px;width:100%;padding:10px 16px;border-top:1px solid var(--line)}.li:first-child{border-top:0}.li:hover{background:var(--accent-soft)}
.li .b{flex:1;min-width:0}.li .b b{display:block;font-weight:600}.li .b span{font-size:12.5px;color:var(--mute)}.li .r{font-size:13px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
#toast.act{pointer-events:auto}.tb{margin-left:10px;font-weight:700;color:var(--accent-soft);text-decoration:underline}
@media (max-width:1060px){.main.wide2{grid-column:1}.wk{grid-template-columns:repeat(7,150px);overflow-x:auto}.avgg{grid-template-columns:repeat(3,1fr)}.hd{grid-template-columns:minmax(120px,1fr) 150px 50px auto}.hw{overflow-x:auto}}
.lbl{display:block;font-size:12px;font-weight:650;color:var(--mute);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.05em}

/* étape 3 : courses, bandeau, impression */
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--warn-soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.banner span{flex:1 1 280px}
.shopdays{display:flex;flex-wrap:wrap;gap:6px}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.shopgrid .card{margin-bottom:0}
.shopi{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.shopi:first-of-type{border-top:0}
.shopi .sname{flex:1}.shopi .sqty{font-variant-numeric:tabular-nums;white-space:nowrap}
.shopi.done .sname,.shopi.done .sqty{text-decoration:line-through;color:var(--mute)}
@media print{.side,.dh .ib,.dh .sp,.tools,.shopdays,.banner,#toast,.mini{display:none!important}.shopgrid{display:block;columns:2}.shopgrid .card{break-inside:avoid;margin-bottom:10px;border:0;padding:4px 0}body{background:#fff;color:#000}}
.shopi .sqty{font-size:14px;font-weight:650;flex:none;margin-left:8px;line-height:1.3}
.shopi .sname{font-size:14.5px;min-width:0}
.shopc{padding:14px 18px}
.shopi{align-items:center}.shopi .sqty{align-self:center;display:block;margin-top:0;padding:0}

/* lisibilité des repas */
.ln.h .hp{color:var(--p)}.ln.h .hc{color:var(--c)}.ln.h .hl{color:var(--l)}.ln.h .hf{color:var(--f)}
.ln.h{font-weight:700}
.ln.sub{background:var(--soft);border-top:1px solid var(--line);padding-block:9px;font-weight:700}
.ln.sub .n{color:var(--ink);font-weight:700}
.ln.sub>span:nth-child(3){color:var(--p)}.ln.sub>span:nth-child(4){color:var(--c)}.ln.sub>span:nth-child(5){color:var(--l)}.ln.sub>span:nth-child(6){color:var(--f)}
.ln.sub .k{font-size:15px}

.stkb{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}.stkb.inc{opacity:.55}
.stkbc{display:grid;place-items:center;width:32px;height:32px;cursor:pointer}.stkbc input{position:absolute;opacity:0;width:32px;height:32px;margin:0}.stkbc .cbx{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}.stkbc input:checked+.cbx{background:var(--accent);border-color:var(--accent)}.stkbc input:checked+.cbx:after{content:"✓"}
.stkbn b{display:block}.stkbn small{display:block;color:var(--mute);font-size:12.5px}

@media (max-width:640px){.stkbbar{bottom:calc(76px + env(safe-area-inset-bottom))}.stkb{grid-template-columns:auto 1fr}.stkb .qc{grid-column:2}}

.rsg{gap:10px}

function draftToFood(d) {

  if (d.unit === 'portion' && !d.recipe && d.mode === '100' && num(d.ck) > 0) o.pkw = num(d.ck); else delete o.pkw;

  if (pk.length && !d.recipe) o.packs = pk; else delete o.packs;

function copyRows(dest) {

  if (r.status === 401) throw Object.assign(new Error('Jeton refusé ou expiré : crée-en un nouveau (bouton « Changer de jeton »).'), { code: 401 });
  if (r.status === 403) throw Object.assign(new Error('GitHub refuse : le jeton n\'a pas le droit « gist », ou trop de requêtes. Réessaie plus tard.'), { code: 403 });
  if (r.status === 404) throw Object.assign(new Error('Données introuvables chez GitHub (gist supprimé ?). Arrête puis réactive la synchronisation.'), { code: 404 });
  if (!r.ok) throw Object.assign(new Error('GitHub a répondu une erreur (' + r.status + ').'), { code: r.status });

}

// Lecture d'une étiquette nutritionnelle : transforme le texte reconnu (souvent imparfait) en valeurs pour 100 g.
function parseLabel(raw) {

  const pick = a => a.length ? (a[col] || a[0]) : null;

    for (let i = 0; i < lines.length; i++) {
      const ln = lines[i]; const m = re.exec(ln); if (!m) continue;
      if (k === 'l' && /satur|mono|poly|trans/.test(ln.slice(0, m.index + 14)) && !/matiere|lipide/.test(ln)) continue;
      if (k === 'l' && /^dont/.test(ln)) continue;

    while ((m = re.exec(blob))) (m[2] === 'kcal' ? kc : kjs).push(+m[1]);
    const kcal = kc[col] ?? kc[0], kj = kjs[col] ?? kjs[0];
    if (kcal != null) vals.k = kcal; else if (kj != null) { vals.k = Math.round(kj / 4.184); notes.push(`Calories calculées depuis les ${kj} kJ de l'étiquette.`); }
    if (kcal != null && kj != null && Math.abs(kj / 4.184 - kcal) > 0.04 * kcal + 3) warn.k = { read: String(kcal), msg: `${kj} kJ ≈ ${Math.round(kj / 4.184)} kcal, pas ${kcal} : à vérifier` };
  }
  if (basis === 'portion') {
    const pm = /(?:portion|par|ration)[^\d\n]{0,12}(\d+(?:\.\d+)?)\s*(g|ml)\b/.exec(t) || /\((\d+(?:\.\d+)?)\s*(g|ml)\)/.exec(t), size = pm ? +pm[1] : 0;

    else notes.push('Je n\'ai vu que des valeurs « par portion », sans poids de portion : vérifie la base (pour 100 g ou par portion).');
  }
  for (const k of ['p', 'c', 'l', 'f']) if (vals[k] > 100) warn[k] = { read: vals[k], msg: 'Plus de 100 g pour 100 g : à vérifier' };

  }

  return { vals, warn, notes, basis, found: Object.keys(vals).length };
}

extraInput = function (e) { const el = e.target; if (el.dataset?.i === 'devfield') { ui.dev.form[el.dataset.k] = el.value; return true; } return prevExtraInputDv(e); };
async function devInit() {
  while (!S) await new Promise(r => setTimeout(r, 50));
  try {
    const c = await idbGet('dev');
    if (c?.token && c?.gist) {
      ui.dev.cfg = c; if (c.file === undefined) c.file = devFile(c.me.id);
      if (!devOn()) { S.meta.dev = { on: true, me: c.me, recs: {}, lc: 0, conf: [] }; devStamp(true); scheduleSave(); }
      devSoon(2500);
    }
  } catch { }
  subscribe(() => { if (ui.dev.cfg && !ui.dev.applying && devOn()) { S.meta.dev.lc = Date.now(); devSoon(3000); } });
  setInterval(() => { if (!document.hidden && ui.dev.cfg) devSync(false); }, 45000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && ui.dev.cfg) devSoon(500); });
  render();
}
devInit();

// ---------- jeton GitHub : un seul endroit pour le créer, l'enregistrer et le remplacer ----------
ui.tk = { v: '', err: '', busy: false, token: '' };
function tokCard() {
  const s = ui.tk, has = !!ghTok();
  return `<section class="card"><h2>Jeton GitHub</h2>
    <p>${has ? '✓ Un jeton est enregistré dans cette application.' : 'Le jeton est la clé qui relie l\'application à ton compte GitHub.'} Il sert à la sauvegarde en ligne, à la synchronisation et au partage : tu ne le saisis qu'ici, une seule fois par appareil. ${has ? 'Si GitHub le refuse (expiré, supprimé ou mal copié), crée-en un nouveau puis remplace-le ici : il est changé partout d\'un coup.' : ''}</p>
    <div class="note"><b>Créer un jeton :</b> clique sur le bouton ci-dessous, connecte-toi à GitHub si besoin, choisis la durée « No expiration », laisse cochée la case « gist », puis clique sur « Generate token » en bas de la page GitHub. Copie le jeton affiché (il commence par ghp_) : GitHub ne le montre qu'une fois.</div>
    <div class="row"><a class="btn" href="https://github.com/settings/tokens/new?scopes=gist&description=Meal%20Tracker" target="_blank" rel="noopener">Créer un nouveau jeton sur GitHub</a></div>
    <label class="fld"><span class="mini">${has ? 'Coller le nouveau jeton' : 'Coller ton jeton'} (commence par ghp_…)</span><input type="${s.show ? 'text' : 'password'}" data-i="tkfield" data-fk="tk-token" value="${esc(s.v)}" placeholder="ghp_…" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="mini" style="display:flex;gap:8px;align-items:center;margin-top:2px;margin-bottom:8px"><input type="checkbox" style="width:auto;flex:none;margin:0" data-a="tokshow" data-w="tk" ${s.show ? 'checked' : ''}> Afficher le jeton pour le vérifier${s.v ? ` (${s.v.length} caractères, il en faut environ 40)` : ''}</label>
    ${s.err ? `<p class="warn">${esc(s.err)}</p>` : ''}
    <div class="row"><button class="btn pri" data-a="tkreplace" ${s.busy ? 'disabled' : ''}>${s.busy ? 'Vérification…' : has ? 'Remplacer le jeton' : 'Enregistrer le jeton'}</button></div></section>`;
}
Object.assign(actions, {
  tkgo: () => { ui.setOpen['Jeton GitHub'] = true; render(); setTimeout(() => document.querySelector('details[data-sec="Jeton GitHub"]')?.scrollIntoView({ block: 'start', behavior: 'smooth' }), 50); },
  tkreplace: async () => {
    const s = ui.tk, token = cleanTok(s.v);
    if (!/^(ghp_|github_pat_)\w+/.test(token)) { s.err = 'Colle ton jeton GitHub (il commence par ghp_).'; return render(); }
    s.busy = true; s.err = ''; render();
    try {
      await ghFetch(token, '/gists?per_page=1');
      s.token = token; await idbSet('tok', { token });
      for (const [k, c] of [['cbk', ui.cbk?.cfg], ['dev', ui.dev?.cfg], ['sync', ui.sync?.cfg], ['share', ui.share?.cfg], ['cbkpull', ui.cbk?.pull]]) if (c) { c.token = token; await idbSet(k, { ...c }); }
      s.v = ''; toast('Jeton enregistré', [], 3500);
    } catch (e) { s.err = e.message || String(e); }
    s.busy = false; render();
  },
});
const prevExtraInputTk = extraInput;
extraInput = function (e) { const el = e.target; if (el.dataset?.i === 'tkfield') { ui.tk.v = el.value; return true; } return prevExtraInputTk(e); };
(async () => { try { const t = await idbGet('tok'); if (t?.token) { ui.tk.token = t.token; render(); } } catch { } })();

// ---- main.js ----



async function start() {
  try { await init(); } catch (e) { document.getElementById('app').innerHTML = `<main class="main"><h1>Impossible de démarrer</h1><p>${String(e.message || e)}</p></main>`; return; }
  subscribe(render);
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKey);
  render();
  const top = document.createElement('button');
  top.id = 'totop'; top.type = 'button'; top.title = 'Revenir en haut de la page'; top.setAttribute('aria-label', 'Revenir en haut de la page');
  top.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>';
  top.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  document.body.appendChild(top);
  const upd = () => top.classList.toggle('show', window.scrollY > 500);
  window.addEventListener('scroll', upd, { passive: true }); upd();
}
start();


})();
</script>
